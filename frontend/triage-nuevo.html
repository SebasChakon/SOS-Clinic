<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOS · Nuevo triage</title>
<link rel="stylesheet" href="assets/estilos.css">
<script src="assets/movimiento.js"></script>
</head>


<body>

<div class="topbar">
  <div class="marca"><strong>SOS</strong> · Sistema de Triage Inteligente</div>
  <nav id="navPrincipal"></nav>
  <div style="display:flex; align-items:center; gap:14px;">
    <span id="infoUsuario" class="usuario-info"></span>
    <button class="salir" onclick="cerrarSesion()">Salir</button>
  </div>
</div>

<div class="contenido" style="max-width:520px;">
  <h1>Registrar llegada a triage</h1>
  <p class="sub">Escribe la cédula; aparecerán los pacientes registrados que coincidan.</p>

  <div class="tarjeta">
    <form id="formTriage">
      <div class="campo">
        <label for="cedula">Cédula del paciente</label>
        <input class="input-autocompletar" type="text" id="cedula" list="listaCedulas" placeholder="Escribe para buscar..." autocomplete="off" required>
        <datalist id="listaCedulas"></datalist>
      </div>

      <div class="campo" id="campoPacienteEncontrado" style="display:none;">
        <label>Paciente</label>
        <div id="nombrePacienteEncontrado" style="font-size:14.5px; padding:8px 0;"></div>
      </div>

      <div class="campo">
        <label for="categoria">Categoría de triage</label>
        <select id="categoria" required>
          <option value="">Selecciona una categoría</option>
          <option value="1">1 · Resucitación</option>
          <option value="2">2 · Emergencia</option>
          <option value="3">3 · Urgencia</option>
          <option value="4">4 · Urgencia menor</option>
          <option value="5">5 · Sin urgencia</option>
        </select>
      </div>

      <div class="campo">
        <label for="ubicacion">Ubicación</label>
        <select id="ubicacion">
          <option value="">Sin ubicación</option>
        </select>
      </div>

      <button type="submit" id="btnRegistrar" class="boton-primario boton-full">Registrar llegada</button>

      <div class="mensaje" id="mensajeTriage"></div>
    </form>
  </div>
</div>

<script src="assets/api.js"></script>
<script>
  exigirSesion();
  pintarNav('navPrincipal', 'triage-nuevo.html');

  const sesion = obtenerSesion();
  document.getElementById('infoUsuario').textContent = `${sesion.usuario} · ${sesion.perfil}`;

  document.getElementById('ubicacion').insertAdjacentHTML('beforeend',
    [...new Set(UBICACIONES_DISPONIBLES)].map(u => `<option value="${u}">${u}</option>`).join(''));

  const formTriage = document.getElementById('formTriage');
  const campoCedula = document.getElementById('cedula');
  const campoPacienteEncontrado = document.getElementById('campoPacienteEncontrado');
  const nombrePacienteEncontrado = document.getElementById('nombrePacienteEncontrado');
  const listaCedulas = document.getElementById('listaCedulas');

  let idPacienteEncontrado = null;
  let ultimaBusqueda = null;
  let temporizadorBusqueda = null;
  let resultadosActuales = [];

  campoCedula.addEventListener('input', () => {
    idPacienteEncontrado = null;
    campoPacienteEncontrado.style.display = 'none';

    const valor = campoCedula.value.trim();
    clearTimeout(temporizadorBusqueda);

    if (valor.length < 2) {
      listaCedulas.innerHTML = '';
      return;
    }

    temporizadorBusqueda = setTimeout(async () => {
      ultimaBusqueda = valor;
      try {
        const resultados = await buscarPacientesPorCedula(valor);
        if (ultimaBusqueda !== valor) return; // respuesta vieja, ignorar

        resultadosActuales = resultados;
        listaCedulas.innerHTML = resultados.map(p =>
          `<option value="${escaparHtml(p.cedula)}">${escaparHtml(p.nombre)} ${escaparHtml(p.apellido)}</option>`
        ).join('');

        const exacto = resultados.find(p => p.cedula === valor);
        if (exacto) seleccionarPaciente(exacto);
      } catch (error) {
        listaCedulas.innerHTML = '';
      }
    }, 300);
  });

  function seleccionarPaciente(paciente) {
    idPacienteEncontrado = paciente.idPaciente;
    nombrePacienteEncontrado.textContent = `${paciente.nombre} ${paciente.apellido}`;
    nombrePacienteEncontrado.style.color = 'var(--teal-hover)';
    campoPacienteEncontrado.style.display = 'block';
  }

  campoCedula.addEventListener('blur', () => {
    if (idPacienteEncontrado) return;
    const valor = campoCedula.value.trim();
    const exacto = resultadosActuales.find(p => p.cedula === valor);
    if (exacto) {
      seleccionarPaciente(exacto);
    } else if (valor) {
      nombrePacienteEncontrado.textContent = 'No encontrado — regístralo primero en la pantalla de Pacientes';
      nombrePacienteEncontrado.style.color = 'var(--rojo-alerta)';
      campoPacienteEncontrado.style.display = 'block';
    }
  });

  formTriage.addEventListener('submit', async (evento) => {
    evento.preventDefault();
    limpiarMensaje('mensajeTriage');

    if (!idPacienteEncontrado) {
      mostrarMensaje('mensajeTriage', 'Busca un paciente valido por cedula antes de registrar la llegada', 'error');
      return;
    }

    const boton = document.getElementById('btnRegistrar');
    boton.disabled = true;
    boton.textContent = 'Registrando...';

    try {
      await registrarTriage({
        idPaciente: idPacienteEncontrado,
        idCategoriaTriage: Number(document.getElementById('categoria').value),
        ubicacion: document.getElementById('ubicacion').value.trim()
      });

      mostrarMensaje('mensajeTriage', 'Llegada registrada correctamente', 'exito');
      formTriage.reset();
      campoPacienteEncontrado.style.display = 'none';
      idPacienteEncontrado = null;
      listaCedulas.innerHTML = '';
    } catch (error) {
      mostrarMensaje('mensajeTriage', error.message, 'error');
    } finally {
      boton.disabled = false;
      boton.textContent = 'Registrar llegada';
    }
  });
</script>

<script src="assets/copiloto.js"></script>

</body>
</html>
