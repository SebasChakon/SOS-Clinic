<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOS · Acceso al sistema</title>
<link rel="stylesheet" href="assets/estilos.css">
</head>

<script src="assets/copiloto.js"></script>
<body>

<div class="layout-login">

  <div class="panel-info">
    <div class="marca"><strong>SOS</strong> · Sistema de Triage Inteligente</div>

    <div class="titular">
      <h1>Acceso del personal de urgencias</h1>
      <p>Ingresa con tu usuario y clave registrados para acceder al registro de pacientes y a la lista de priorizacion.</p>
    </div>

    <div class="pie-estado">
      <div><span class="punto"></span>eureka-server</div>
      <div><span class="punto"></span>ms-gateway</div>
      <div><span class="punto"></span>ms-seguridad</div>
    </div>
  </div>

  <div class="panel-form">
    <div class="tarjeta">
      <h2 id="tituloForm">Iniciar sesión</h2>
      <p class="sub" id="subtituloForm">Ingresa con tus credenciales de personal registrado.</p>

      <form id="formLogin">
        <div class="campo">
          <label for="usuario">Usuario</label>
          <input type="text" id="usuario" placeholder="ana.triage" autocomplete="username" required>
        </div>

        <div class="campo">
          <label for="clave">Clave</label>
          <input type="password" id="clave" placeholder="********" autocomplete="current-password" required>
        </div>

        <button type="submit" id="btnEntrar" class="boton-primario boton-full">Entrar</button>
      </form>

      <form id="formCodigo" style="display:none;">
        <input type="hidden" id="usuarioParaCodigo">
        <div class="campo">
          <label for="codigoIngresado">Código de verificación</label>
          <input type="text" id="codigoIngresado" placeholder="123456" maxlength="6" inputmode="numeric" required>
        </div>
        <button type="submit" id="btnVerificar" class="boton-primario boton-full">Verificar</button>
        <button type="button" class="boton-secundario boton-full" style="margin-top:8px;" onclick="volverALogin()">Volver</button>
      </form>

      <div class="mensaje" id="mensaje"></div>
    </div>
  </div>

</div>

<script src="assets/api.js"></script>
<script>
  const formLogin = document.getElementById('formLogin');
  const formCodigo = document.getElementById('formCodigo');
  const boton = document.getElementById('btnEntrar');
  const botonVerificar = document.getElementById('btnVerificar');

  // Si ya hay una sesion activa, no tiene sentido mostrar el login de nuevo
  if (haySesion()) {
    const sesion = obtenerSesion();
    window.location.href = primerDestinoValido(sesion.actividades) || 'index.html';
  }

  formLogin.addEventListener('submit', async (evento) => {
    evento.preventDefault();

    const usuario = document.getElementById('usuario').value.trim();
    const clave = document.getElementById('clave').value;

    limpiarMensaje('mensaje');
    boton.disabled = true;
    boton.textContent = 'Verificando...';

    try {
      const datos = await login(usuario, clave);

      if (datos.requiere2fa) {
        mostrarPasoCodigo(usuario);
        return;
      }

      const destino = primerDestinoValido(datos.actividades);

      if (!destino) {
        mostrarMensaje('mensaje', 'Tu usuario no tiene ninguna pantalla asignada. Contacta al coordinador de turnos.', 'error');
        return;
      }

      mostrarMensaje('mensaje', `Sesion iniciada como ${datos.usuario} (perfil: ${datos.perfil}). Redirigiendo...`, 'exito');
      setTimeout(() => { window.location.href = destino; }, 700);
    } catch (error) {
      mostrarMensaje('mensaje', error.message, 'error');
    } finally {
      boton.disabled = false;
      boton.textContent = 'Entrar';
    }
  });

  function mostrarPasoCodigo(usuario) {
    formLogin.style.display = 'none';
    formCodigo.style.display = 'block';
    document.getElementById('usuarioParaCodigo').value = usuario;
    document.getElementById('tituloForm').textContent = 'Verificación en dos pasos';
    document.getElementById('subtituloForm').textContent = 'Revisa tu correo e ingresa el código de 6 dígitos.';
    mostrarMensaje('mensaje', 'Te enviamos un código a tu correo registrado. Expira en 5 minutos.', 'exito');
    document.getElementById('codigoIngresado').focus();
  }

  function volverALogin() {
    formCodigo.style.display = 'none';
    formLogin.style.display = 'block';
    document.getElementById('tituloForm').textContent = 'Iniciar sesión';
    document.getElementById('subtituloForm').textContent = 'Ingresa con tus credenciales de personal registrado.';
    document.getElementById('codigoIngresado').value = '';
    limpiarMensaje('mensaje');
  }

  formCodigo.addEventListener('submit', async (evento) => {
    evento.preventDefault();

    const usuario = document.getElementById('usuarioParaCodigo').value;
    const codigo = document.getElementById('codigoIngresado').value.trim();

    limpiarMensaje('mensaje');
    botonVerificar.disabled = true;
    botonVerificar.textContent = 'Verificando...';

    try {
      const datos = await verificarCodigo2fa(usuario, codigo);
      const destino = primerDestinoValido(datos.actividades);

      if (!destino) {
        mostrarMensaje('mensaje', 'Tu usuario no tiene ninguna pantalla asignada. Contacta al coordinador de turnos.', 'error');
        return;
      }

      mostrarMensaje('mensaje', 'Código verificado. Redirigiendo...', 'exito');
      setTimeout(() => { window.location.href = destino; }, 700);
    } catch (error) {
      mostrarMensaje('mensaje', error.message, 'error');
    } finally {
      botonVerificar.disabled = false;
      botonVerificar.textContent = 'Verificar';
    }
  });
</script>

</body>
</html>
