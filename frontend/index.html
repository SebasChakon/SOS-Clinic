<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOS · Acceso al sistema</title>
<link rel="stylesheet" href="assets/estilos.css">
</head>
<body>

<div class="layout-login">

  <div class="panel-info">
    <div class="marca"><strong>SOS</strong> · Sistema de Triage Inteligente</div>

    <div class="titular">
      <h1>Acceso del personal de urgencias</h1>
      <p>Ingresa con tu usuario y clave registrados para acceder al registro de pacientes y a la lista de priorizacion.</p>
    </div>

    <div class="pie-estado">
      <div><span class="punto"></span>eureka-server</div>
      <div><span class="punto"></span>ms-gateway</div>
      <div><span class="punto"></span>ms-seguridad</div>
    </div>
  </div>

  <div class="panel-form">
    <div class="tarjeta">
      <h2>Iniciar sesión</h2>
      <p class="sub">Ingresa con tus credenciales de personal registrado.</p>

      <form id="formLogin">
        <div class="campo">
          <label for="usuario">Usuario</label>
          <input type="text" id="usuario" placeholder="ana.triage" autocomplete="username" required>
        </div>

        <div class="campo">
          <label for="clave">Clave</label>
          <input type="password" id="clave" placeholder="********" autocomplete="current-password" required>
        </div>

        <button type="submit" id="btnEntrar" class="boton-primario boton-full">Entrar</button>

        <div class="mensaje" id="mensaje"></div>
      </form>
    </div>
  </div>

</div>

<script src="assets/api.js"></script>
<script>
  const form = document.getElementById('formLogin');
  const boton = document.getElementById('btnEntrar');

  // Si ya hay una sesion activa, no tiene sentido mostrar el login de nuevo
  if (haySesion()) {
    window.location.href = 'triage.html';
  }

  form.addEventListener('submit', async (evento) => {
    evento.preventDefault();

    const usuario = document.getElementById('usuario').value.trim();
    const clave = document.getElementById('clave').value;

    limpiarMensaje('mensaje');
    boton.disabled = true;
    boton.textContent = 'Verificando...';

    try {
      const datos = await login(usuario, clave);
      mostrarMensaje('mensaje', `Sesion iniciada como ${datos.usuario} (perfil: ${datos.perfil}). Redirigiendo...`, 'exito');
      setTimeout(() => { window.location.href = 'triage.html'; }, 700);
    } catch (error) {
      mostrarMensaje('mensaje', error.message, 'error');
    } finally {
      boton.disabled = false;
      boton.textContent = 'Entrar';
    }
  });
</script>

</body>
</html>
