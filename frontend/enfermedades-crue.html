<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOS · Enfermedades CRUE</title>
<link rel="stylesheet" href="assets/estilos.css">
<script src="assets/movimiento.js"></script>
<style>
  .contenido-crue {
    max-width: 1600px;
    padding: 24px;
  }

  .crue-acciones {
    display: flex;
    justify-content: flex-end;
    margin: -12px 0 12px;
  }

  .crue-acciones a {
    color: var(--acento);
    font-family: var(--mono);
    font-size: 12.5px;
    text-decoration: none;
    border-bottom: 1px solid var(--liquen);
    padding-bottom: 3px;
  }

  .crue-acciones a:hover {
    border-bottom-color: var(--acento);
  }

  .crue-marco {
    position: relative;
    height: min(78vh, 920px);
    min-height: 560px;
    overflow: hidden;
    border: 1px solid var(--gris-linea);
    border-radius: var(--radio-tarjeta);
    background: #fff;
  }

  .crue-marco iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
  }

  .crue-cargando {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    background: #fff;
    color: var(--texto-suave);
    font-family: var(--mono);
    font-size: 12.5px;
    pointer-events: none;
  }

  .crue-cargando[hidden] { display: none; }

  .crue-contexto {
    margin: -4px 0 14px;
    max-width: 75ch;
    color: var(--texto-suave);
    font-size: 14px;
    line-height: 1.55;
  }

  .crue-cargando.error {
    pointer-events: auto;
    background: var(--superficie-aviso);
    color: var(--tinta-aviso);
    padding: 24px;
    text-align: center;
    line-height: 1.55;
  }
  .crue-cargando.error a { color: var(--tinta-aviso); font-weight: 600; }

  @media (max-width: 640px) {
    .contenido-crue { padding: 20px 12px; }
    .crue-marco {
      height: 74vh;
      min-height: 480px;
    }
  }
</style>
</head>


<body>

<a class="skip-link" href="#contenidoPrincipal">Saltar al contenido</a>

<header class="topbar" role="banner">
  <div class="marca" title="SOS Clinic · Sistema de Triage Inteligente"><strong>SOS</strong> · Triage</div>
  <nav id="navPrincipal" aria-label="Navegación principal"></nav>
  <div class="topbar-usuario">
    <span id="infoUsuario" class="usuario-info"></span>
    <button class="salir" type="button" onclick="cerrarSesion()">Salir</button>
  </div>
</header>

<main class="contenido contenido-crue" id="contenidoPrincipal">
  <h1>Enfermedades atendidas por el CRUE</h1>
  <p class="crue-contexto">Reporte público del Centro Regulador de Urgencias y Emergencias. El contenido se carga desde Power BI; si la red o el servicio externo fallan, usa el enlace de respaldo.</p>
  <div class="crue-acciones">
    <a href="https://app.powerbi.com/view?r=eyJrIjoiMzZiMmNiNWUtOTk0Ni00MWM3LTgzNzctZDk0OTljN2ExNjAyIiwidCI6IjRhYjExODNlLTc1ZDYtNGI4Ny1iNGI1LWJmY2I5NjhjMWQ1NyIsImMiOjR9" target="_blank" rel="noopener noreferrer">Abrir reporte en otra pestaña</a>
  </div>
  <div class="crue-marco" id="marcoCrue" aria-busy="true">
    <div class="crue-cargando" id="estadoCarga" role="status">Cargando visualizador...</div>
    <iframe
      id="reporteCrue"
      title="Power BI: principales enfermedades atendidas por el CRUE de Bogotá"
      src="https://app.powerbi.com/view?r=eyJrIjoiMzZiMmNiNWUtOTk0Ni00MWM3LTgzNzctZDk0OTljN2ExNjAyIiwidCI6IjRhYjExODNlLTc1ZDYtNGI4Ny1iNGI1LWJmY2I5NjhjMWQ1NyIsImMiOjR9"
      loading="lazy"
      allowfullscreen="true">
    </iframe>
  </div>
</main>

<script src="assets/api.js"></script>
<script>
  exigirSesion();
  pintarNav('navPrincipal', 'enfermedades-crue.html');

  const sesion = obtenerSesion();
  if (sesion) document.getElementById('infoUsuario').textContent = `${sesion.usuario} · ${sesion.perfil}`;

  const marco = document.getElementById('marcoCrue');
  const estadoCarga = document.getElementById('estadoCarga');
  let cargado = false;
  const URL_REPORTE = 'https://app.powerbi.com/view?r=eyJrIjoiMzZiMmNiNWUtOTk0Ni00MWM3LTgzNzctZDk0OTljN2ExNjAyIiwidCI6IjRhYjExODNlLTc1ZDYtNGI4Ny1iNGI1LWJmY2I5NjhjMWQ1NyIsImMiOjR9';

  document.getElementById('reporteCrue').addEventListener('load', () => {
    cargado = true;
    estadoCarga.hidden = true;
    marco.setAttribute('aria-busy', 'false');
  });

  setTimeout(() => {
    if (cargado) return;
    estadoCarga.hidden = false;
    estadoCarga.classList.add('error');
    estadoCarga.innerHTML = `El reporte está tardando en cargar. Puedes abrirlo directamente en Power BI: <a href="${URL_REPORTE}" target="_blank" rel="noopener noreferrer">abrir reporte</a>.`;
    marco.setAttribute('aria-busy', 'false');
  }, 12000);
</script>

<script src="assets/copiloto.js"></script>

</body>
</html>
