<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOS · Seguimiento del paciente</title>
<link rel="stylesheet" href="assets/estilos.css">
<style>
  .encabezado-paciente { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; flex-wrap: wrap; gap: 16px; }
  .encabezado-paciente h1 { margin: 0 0 4px; }
  .encabezado-paciente .meta { font-size: 13.5px; color: var(--texto-suave); }
  .grid-seguimiento { display: grid; grid-template-columns: 340px 1fr; gap: 24px; align-items: start; }
  .linea-tiempo { display: flex; flex-direction: column; gap: 14px; }
  .toma-vital { border: 1px solid var(--gris-linea); border-radius: 8px; padding: 16px 18px; }
  .toma-vital .fecha { font-size: 12.5px; color: var(--texto-suave); margin-bottom: 10px; }
  .toma-vital .cifras { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 16px; margin-bottom: 10px; }
  .toma-vital .cifra .valor { font-size: 17px; font-weight: 600; }
  .toma-vital .cifra .etiqueta { font-size: 11.5px; color: var(--texto-suave); text-transform: uppercase; letter-spacing: 0.02em; }
  .toma-vital .motivo { font-size: 13.5px; color: var(--texto); background: var(--gris-fondo); padding: 10px 12px; border-radius: 6px; }
  .estado-cerrado { background: var(--verde-fondo); color: var(--teal-hover); border: 1px solid var(--verde-borde); padding: 12px 14px; border-radius: 6px; font-size: 13.5px; margin-bottom: 16px; }
  .ubicacion-editable { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
  .ubicacion-editable select { width: 200px; }
  .ubicacion-editable button { padding: 6px 10px; font-size: 12.5px; }
  .seccion-alta { border-top: 1px solid var(--gris-linea); margin-top: 20px; padding-top: 20px; }
  .resumen-alta { background: var(--gris-fondo); padding: 12px 14px; border-radius: 6px; font-size: 13.5px; margin-bottom: 12px; }
  .resumen-alta strong { display: block; margin-bottom: 4px; }
</style>
</head>

<script src="assets/dograh.js"></script>
<body>

<div class="topbar">
  <div class="marca"><strong>SOS</strong> · Sistema de Triage Inteligente</div>
  <nav id="navPrincipal"></nav>
  <div style="display:flex; align-items:center; gap:14px;">
    <span id="infoUsuario" style="font-size:13px; color:#b9c8d0;"></span>
    <button class="salir" onclick="cerrarSesion()">Salir</button>
  </div>
</div>

<div class="contenido">

  <div class="encabezado-paciente">
    <div>
      <h1 id="nombrePaciente">Cargando...</h1>
      <div class="meta" id="metaRegistro"></div>
      <div class="ubicacion-editable" id="bloqueUbicacion" style="display:none;">
        <select id="inputUbicacion" aria-label="Seleccionar ubicación"></select>
        <button class="boton-secundario" onclick="guardarUbicacion()">Guardar ubicación</button>
      </div>
    </div>
    <div id="accionesEstado" style="display:flex; gap:10px;"></div>
  </div>

  <div id="avisoCerrado"></div>

  <div class="grid-seguimiento">

    <div class="tarjeta">
      <h2>Registrar signos vitales</h2>
      <p class="sub">Se guarda una nueva toma, sin borrar las anteriores.</p>

      <form id="formSignos">
        <div class="fila-campos">
          <div class="campo"><label for="frecuenciaCardiaca">Frec. cardíaca (lpm)</label><input type="number" id="frecuenciaCardiaca" required></div>
          <div class="campo"><label for="frecuenciaRespiratoria">Frec. respiratoria</label><input type="number" id="frecuenciaRespiratoria" required></div>
        </div>
        <div class="fila-campos">
          <div class="campo"><label for="presionSistolica">Presión sistólica</label><input type="number" id="presionSistolica" required></div>
          <div class="campo"><label for="presionDiastolica">Presión diastólica</label><input type="number" id="presionDiastolica" required></div>
        </div>
        <div class="fila-campos">
          <div class="campo"><label for="temperatura">Temperatura (°C)</label><input type="number" step="0.1" id="temperatura" required></div>
          <div class="campo"><label for="saturacion">Saturación (%)</label><input type="number" id="saturacion" required></div>
        </div>
        <div class="campo"><label for="glucemia">Glucemia (opcional)</label><input type="number" step="0.1" id="glucemia"></div>
        <div class="campo"><label for="descripcionSintoma">Motivo / síntomas</label><textarea id="descripcionSintoma" rows="3" placeholder="Dolor toracico, dificultad para respirar..."></textarea></div>
        <button type="submit" id="btnGuardarSignos" class="boton-primario boton-full">Guardar toma</button>
        <div class="mensaje" id="mensajeSignos"></div>
      </form>
    </div>

    <div>
      <div class="tarjeta" id="seccionAlta" style="display:none; margin-bottom:24px;">
        <h2 style="margin-top:0;">Diagnóstico y alta</h2>
        <p class="sub">Obligatorio antes de dar de alta al paciente.</p>
        <form id="formAlta">
          <div class="campo">
            <label for="diagnosticoFinal">Diagnóstico final</label>
            <textarea id="diagnosticoFinal" rows="3" required></textarea>
          </div>
          <div class="campo">
            <label for="tratamiento">Tratamiento / instrucciones en casa / cuándo volver</label>
            <textarea id="tratamiento" rows="3" required></textarea>
          </div>
          <button type="submit" id="btnDarAlta" class="boton-primario boton-full">Dar de alta y enviar historia clínica</button>
          <div class="mensaje" id="mensajeAlta"></div>
        </form>
      </div>

      <div class="tarjeta">
        <h2 style="margin-top:0;">Historial de signos vitales</h2>
        <div class="linea-tiempo" id="lineaTiempo">
          <p class="tabla-vacia">Cargando...</p>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="assets/api.js"></script>
<script>
  exigirSesion();
  pintarNav('navPrincipal', 'seguimiento.html');

  const sesion = obtenerSesion();
  document.getElementById('infoUsuario').textContent = `${sesion.usuario} · ${sesion.perfil}`;

  const parametros = new URLSearchParams(window.location.search);
  const idRegistro = parametros.get('idRegistro');

  if (!idRegistro) {
    window.location.href = primerDestinoValido(sesion.actividades) || 'index.html';
  }

  document.getElementById('inputUbicacion').innerHTML =
    '<option value="" disabled>Selecciona una ubicación</option>' +
    [...new Set(UBICACIONES_DISPONIBLES)].map(u => `<option value="${u}">${u}</option>`).join('');

  let registroActual = null;
  let pacienteActual = null;

  function formatearFecha(isoString) {
    return new Date(isoString).toLocaleString('es-CO', { dateStyle: 'medium', timeStyle: 'short' });
  }

  async function cargarEncabezado() {
    try {
      registroActual = await obtenerRegistroTriage(idRegistro);
      pacienteActual = await obtenerPacientePorId(registroActual.idPaciente);

      document.getElementById('nombrePaciente').textContent = `${pacienteActual.nombre} ${pacienteActual.apellido}`;
      document.getElementById('metaRegistro').textContent =
        `Cédula ${pacienteActual.cedula} · ${registroActual.categoriaTriage.nombreCategoria} · Ubicación: ${registroActual.ubicacion || 'sin asignar'} · Llegó ${formatearFecha(registroActual.fechaHoraLlegada)}`;

      pintarAcciones();
    } catch (error) {
      document.getElementById('nombrePaciente').textContent = 'No se pudo cargar el registro';
      document.getElementById('metaRegistro').textContent = error.message;
    }
  }

  function pintarAcciones() {
    const contenedor = document.getElementById('accionesEstado');
    const aviso = document.getElementById('avisoCerrado');
    const bloqueUbicacion = document.getElementById('bloqueUbicacion');
    const seccionAlta = document.getElementById('seccionAlta');
    const estado = registroActual.estadoTriage.nombreEstado;

    contenedor.innerHTML = '';
    aviso.innerHTML = '';

    if (estado === 'En espera') {
      contenedor.innerHTML = `<button class="boton-primario" onclick="cambiarAEnAtencion()">Marcar en atención</button>`;
      bloqueUbicacion.style.display = 'flex';
      document.getElementById('inputUbicacion').value = registroActual.ubicacion || '';
      seccionAlta.style.display = 'none';
    } else if (estado === 'En atencion') {
      bloqueUbicacion.style.display = 'flex';
      document.getElementById('inputUbicacion').value = registroActual.ubicacion || '';
      seccionAlta.style.display = 'block';
    } else {
      bloqueUbicacion.style.display = 'none';
      seccionAlta.style.display = 'none';
      aviso.innerHTML = `
        <div class="estado-cerrado">
          Este episodio ya fue cerrado (paciente atendido). El historial queda disponible para consulta.
        </div>`;
      document.getElementById('btnGuardarSignos').disabled = true;
    }
  }

  async function cambiarAEnAtencion() {
    try {
      await marcarEnAtencion(idRegistro);
      await cargarEncabezado();
    } catch (error) {
      alert(error.message);
    }
  }

  async function guardarUbicacion() {
    const nuevaUbicacion = document.getElementById('inputUbicacion').value.trim();
    if (!nuevaUbicacion) return;
    try {
      await actualizarUbicacionTriage(idRegistro, nuevaUbicacion);
      await cargarEncabezado();
    } catch (error) {
      alert(error.message);
    }
  }

  document.getElementById('formAlta').addEventListener('submit', async (evento) => {
    evento.preventDefault();
    limpiarMensaje('mensajeAlta');

    const diagnostico = document.getElementById('diagnosticoFinal').value.trim();
    const tratamiento = document.getElementById('tratamiento').value.trim();

    const boton = document.getElementById('btnDarAlta');
    boton.disabled = true;
    boton.textContent = 'Procesando...';

    try {
      await marcarAtendido(idRegistro, diagnostico, tratamiento);
      await cargarEncabezado();
      let mensajeCita = 'Se enviaron al paciente y al profesional los datos de la teleconsulta.';
      let tipoMensaje = 'exito';

      try {
        const nombreCompleto = `${pacienteActual.nombre} ${pacienteActual.apellido}`;
        const cita = await programarTeleconsulta(nombreCompleto);
        await enviarCitaTeleconsulta(pacienteActual.idPaciente, cita);
      } catch (errorCorreo) {
        mensajeCita = `El alta se completó, pero no se pudieron enviar los correos de teleconsulta: ${errorCorreo.message}`;
        tipoMensaje = 'error';
      }

      await generarYEnviarHistoriaClinica(diagnostico, tratamiento);
      mostrarMensaje('mensajeAlta', `Paciente dado de alta. ${mensajeCita} Historia clínica descargada y enviada por correo (si tenía email registrado).`, tipoMensaje);
    } catch (error) {
      mostrarMensaje('mensajeAlta', error.message, 'error');
    } finally {
      boton.disabled = false;
      boton.textContent = 'Dar de alta y enviar historia clínica';
    }
  });

  async function generarYEnviarHistoriaClinica(diagnostico, tratamiento) {
    const signos = await listarSignosVitalesPorRegistro(idRegistro);
    const contenido = construirTextoHistoria(pacienteActual, registroActual, signos, diagnostico, tratamiento);

    const blob = new Blob([contenido], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const enlace = document.createElement('a');
    enlace.href = url;
    enlace.download = `historia_clinica_${pacienteActual.cedula}.txt`;
    enlace.click();
    URL.revokeObjectURL(url);

    if (pacienteActual.email) {
      try {
        await enviarHistoriaClinica(pacienteActual.idPaciente, contenido);
      } catch (error) {
        console.error('No se pudo enviar el correo:', error.message);
      }
    }
  }

  function construirTextoHistoria(paciente, registro, signos, diagnostico, tratamiento) {
    let texto = `HISTORIA CLINICA - SOS SISTEMA DE TRIAGE\n==========================================\n\n`;
    texto += `Paciente: ${paciente.nombre} ${paciente.apellido}\nCedula: ${paciente.cedula}\nFecha de nacimiento: ${paciente.fechaNacimiento}\n\n`;
    texto += `Categoria de triage: ${registro.categoriaTriage.nombreCategoria}\nUbicacion final: ${registro.ubicacion || '-'}\n`;
    texto += `Llegada: ${formatearFecha(registro.fechaHoraLlegada)}\nFecha de alta: ${new Date().toLocaleString('es-CO')}\n\n`;
    texto += `DIAGNOSTICO FINAL\n------------------\n${diagnostico}\n\n`;
    texto += `TRATAMIENTO E INSTRUCCIONES\n----------------------------\n${tratamiento}\n\n`;
    texto += `HISTORIAL DE SIGNOS VITALES (${signos.length} tomas)\n------------------------------------------\n`;

    const ordenado = [...signos].sort((a, b) => new Date(a.fechaHoraToma) - new Date(b.fechaHoraToma));
    ordenado.forEach((toma, i) => {
      texto += `\nToma ${i + 1} - ${formatearFecha(toma.fechaHoraToma)}\n`;
      texto += `  FC: ${toma.frecuenciaCardiaca} lpm | Presion: ${toma.presionSistolica}/${toma.presionDiastolica} | Temp: ${toma.temperatura}°C | SatO2: ${toma.saturacion}% | FR: ${toma.frecuenciaRespiratoria}\n`;
      if (toma.glucemia) texto += `  Glucemia: ${toma.glucemia}\n`;
      if (toma.descripcionSintoma) texto += `  Motivo/sintomas: ${toma.descripcionSintoma}\n`;
    });

    return texto;
  }

  function pintarHistorial(lista) {
    const contenedor = document.getElementById('lineaTiempo');
    if (lista.length === 0) {
      contenedor.innerHTML = '<p class="tabla-vacia">Aún no se han registrado signos vitales</p>';
      return;
    }
    const ordenada = [...lista].sort((a, b) => new Date(b.fechaHoraToma) - new Date(a.fechaHoraToma));
    contenedor.innerHTML = ordenada.map((toma) => `
      <div class="toma-vital">
        <div class="fecha">${formatearFecha(toma.fechaHoraToma)}</div>
        <div class="cifras">
          <div class="cifra"><div class="valor">${toma.frecuenciaCardiaca}</div><div class="etiqueta">FC lpm</div></div>
          <div class="cifra"><div class="valor">${toma.presionSistolica}/${toma.presionDiastolica}</div><div class="etiqueta">Presión</div></div>
          <div class="cifra"><div class="valor">${toma.temperatura}°C</div><div class="etiqueta">Temp.</div></div>
          <div class="cifra"><div class="valor">${toma.saturacion}%</div><div class="etiqueta">SatO2</div></div>
          <div class="cifra"><div class="valor">${toma.frecuenciaRespiratoria}</div><div class="etiqueta">FR</div></div>
          ${toma.glucemia ? `<div class="cifra"><div class="valor">${toma.glucemia}</div><div class="etiqueta">Glucemia</div></div>` : ''}
        </div>
        ${toma.descripcionSintoma ? `<div class="motivo">${toma.descripcionSintoma}</div>` : ''}
      </div>`).join('');
  }

  async function cargarHistorial() {
    try {
      const lista = await listarSignosVitalesPorRegistro(idRegistro);
      pintarHistorial(lista);
    } catch (error) {
      document.getElementById('lineaTiempo').innerHTML = `<p class="tabla-vacia">${error.message}</p>`;
    }
  }

  document.getElementById('formSignos').addEventListener('submit', async (evento) => {
    evento.preventDefault();
    limpiarMensaje('mensajeSignos');

    const boton = document.getElementById('btnGuardarSignos');
    boton.disabled = true;
    boton.textContent = 'Guardando...';

    try {
      const glucemiaValor = document.getElementById('glucemia').value;
      await registrarSignosVitales({
        idRegistro: Number(idRegistro),
        idPersonal: Number(sesion.idPersonal),
        frecuenciaCardiaca: Number(document.getElementById('frecuenciaCardiaca').value),
        presionSistolica: Number(document.getElementById('presionSistolica').value),
        presionDiastolica: Number(document.getElementById('presionDiastolica').value),
        temperatura: Number(document.getElementById('temperatura').value),
        saturacion: Number(document.getElementById('saturacion').value),
        frecuenciaRespiratoria: Number(document.getElementById('frecuenciaRespiratoria').value),
        glucemia: glucemiaValor ? Number(glucemiaValor) : null,
        descripcionSintoma: document.getElementById('descripcionSintoma').value.trim()
      });

      mostrarMensaje('mensajeSignos', 'Toma registrada correctamente', 'exito');
      document.getElementById('formSignos').reset();
      cargarHistorial();
    } catch (error) {
      mostrarMensaje('mensajeSignos', error.message, 'error');
    } finally {
      boton.disabled = false;
      boton.textContent = 'Guardar toma';
    }
  });

  cargarEncabezado();
  cargarHistorial();
</script>

</body>
</html>
