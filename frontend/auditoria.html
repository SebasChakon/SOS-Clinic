<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOS · Auditoría</title>
<link rel="stylesheet" href="assets/estilos.css">
<style>
  .accion-badge { padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; }
  .accion-crear { background: var(--verde-fondo); color: var(--teal-hover); }
  .accion-actualizar { background: #fff4e0; color: #a9670a; }
  .accion-eliminar, .accion-desactivar { background: var(--rojo-fondo); color: var(--rojo-alerta); }
  .accion-activar { background: var(--verde-fondo); color: var(--teal-hover); }
</style>
</head>

<script src="assets/dograh.js"></script>
<body>

<div class="topbar">
  <div class="marca"><strong>SOS</strong> · Sistema de Triage Inteligente</div>
  <nav id="navPrincipal"></nav>
  <div style="display:flex; align-items:center; gap:14px;">
    <span id="infoUsuario" style="font-size:13px; color:#b9c8d0;"></span>
    <button class="salir" onclick="cerrarSesion()">Salir</button>
  </div>
</div>

<div class="contenido">
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <div>
      <h1>Auditoría</h1>
      <p class="sub" style="margin:0;">Registro de acciones administrativas del sistema.</p>
    </div>
    <button class="boton-secundario" onclick="cargarAuditoria()">Actualizar</button>
  </div>

  <div class="tarjeta" style="margin-top:20px;">
    <table>
      <thead><tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Detalle</th></tr></thead>
      <tbody id="tablaAuditoria"><tr><td colspan="4" class="tabla-vacia">Cargando...</td></tr></tbody>
    </table>
  </div>
</div>

<script src="assets/api.js"></script>
<script>
  exigirSesion();
  pintarNav('navPrincipal', 'auditoria.html');
  const sesion = obtenerSesion();
  document.getElementById('infoUsuario').textContent = `${sesion.usuario} · ${sesion.perfil}`;

  function formatearFecha(iso) {
    return new Date(iso).toLocaleString('es-CO', { dateStyle: 'medium', timeStyle: 'short' });
  }

  async function cargarAuditoria() {
    const cuerpo = document.getElementById('tablaAuditoria');
    try {
      const logs = await listarAuditoria();
      cuerpo.innerHTML = logs.map(l => `
        <tr>
          <td>${formatearFecha(l.fechaHora)}</td>
          <td>${l.usuario}</td>
          <td><span class="accion-badge accion-${l.accion.toLowerCase()}">${l.accion}</span></td>
          <td>${l.detalle || '—'}</td>
        </tr>`).join('') || '<tr><td colspan="4" class="tabla-vacia">Sin registros todavía</td></tr>';
    } catch (error) {
      cuerpo.innerHTML = `<tr><td colspan="4" class="tabla-vacia">${error.message}</td></tr>`;
    }
  }

  cargarAuditoria();
</script>

</body>
</html>
