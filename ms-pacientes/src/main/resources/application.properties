server.port=8082
spring.application.name=ms-pacientes

# Credenciales (.env del repo raiz, SMTP, etc.): las carga automaticamente
# EnvEnvironmentPostProcessor al arrancar, sin importar como se lance
# (NetBeans, mvn o levantar-sistema.bat). Las variables reales del entorno
# tienen prioridad sobre el archivo.

spring.datasource.url=jdbc:postgresql://localhost:5433/sosclinic
spring.datasource.username=sos_admin
spring.datasource.password=sos_pass_dev
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# URLs de los servicios con los que ms-pacientes conversa internamente
# (la historia clinica y la orquestacion del alta necesitan datos de triage
# y la confirmacion de teleconsulta se resuelve en ms-seguridad).
app.triage.url=${TRIAGE_URL:http://localhost:8083}
app.seguridad.url=${SEGURIDAD_URL:http://localhost:8081}

# Farmacias cercanas por OpenStreetMap (sin API key).
# Overpass busca las farmacias; Nominatim geocodifica la direccion manual.
app.farmacias.overpass-url=${OVERPASS_URL:https://overpass-api.de/api/interpreter}
app.farmacias.nominatim-url=${NOMINATIM_URL:https://nominatim.openstreetmap.org}
app.farmacias.radio-metros=3000
app.farmacias.max-resultados=5

# SMTP: las credenciales NUNCA se versionan. Se leen del archivo .env
# (cargado automaticamente por EnvEnvironmentPostProcessor) o de variables
# de entorno del sistema, que tienen prioridad.
spring.mail.host=${MAIL_SMTP_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_SMTP_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Timeouts: si el servidor de correo no responde, el envio falla rapido
# en vez de bloquear la peticion del usuario.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.remitente=${MAIL_USERNAME:noreply@sosclinic.local}