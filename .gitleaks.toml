# Configuracion de gitleaks para el repositorio.
# Extiende las reglas por defecto y documenta los falsos positivos conocidos:
# el enlace publico del reporte Power BI del CRUE y el archivo .env local
# (ignorado por git, pero presente en el disco durante las pruebas).
[extend]
useDefault = true

[allowlist]
description = "Falsos positivos conocidos y credenciales locales ignoradas"
paths = [
  '''(?i)(^|/)\.env$''',
  '''(?i)(^|/)env$'''
]
regexTarget = "line"
regexes = [
  '''app\.powerbi\.com/view'''
]
