# Configuracion de gitleaks para el repositorio.
# Extiende las reglas por defecto y documenta los falsos positivos conocidos:
# el archivo .env local (ignorado por git, pero presente en el disco durante
# las pruebas), las credenciales de prueba de src/test/ y seguridad/pruebas/,
# y las credenciales locales del seed en infra/seed/.
[extend]
useDefault = true

[allowlist]
description = "Falsos positivos conocidos y credenciales locales ignoradas"
paths = [
  '''(?i)(^|/)\.env$''',
  '''(?i)(^|/)env$''',
  '''(?i)(^|/)seguridad/pruebas/''',
  '''(?i)(^|/)src/test/''',
  '''(?i)(^|/)infra/seed/credenciales\.local\.'''
]
