server.port=8081
server.address=127.0.0.1
spring.application.name=ms-seguridad

# Credenciales (.env del repo raiz, SMTP, etc.): las carga automaticamente
# EnvEnvironmentPostProcessor al arrancar, sin importar como se lance
# (NetBeans, mvn o levantar-sistema.bat). Las variables reales del entorno
# tienen prioridad sobre el archivo.

spring.datasource.url=jdbc:postgresql://localhost:5433/sosclinic
spring.datasource.username=${DB_USERNAME:sos_admin}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1

# JWT de acceso: corto, se renueva con el refresh token de la sesion.
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

# Sesion de aplicacion (refresh token opaco).
# idle-ms: se extiende con cada renovacion; si el usuario no usa la app, vence.
# max-ms: tope absoluto aunque el usuario siga activo.
app.session.idle-ms=${SESSION_IDLE_MS:28800000}
app.session.max-ms=${SESSION_MAX_MS:43200000}

# Enlaces de activacion y recuperacion de clave. Debe apuntar al frontend.
app.frontend.url=${FRONTEND_URL:http://127.0.0.1:5500}

# SMTP: las credenciales NUNCA se versionan. Se leen del archivo .env
# (cargado automaticamente por EnvEnvironmentPostProcessor) o de variables
# de entorno del sistema, que tienen prioridad.
spring.mail.host=${MAIL_SMTP_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_SMTP_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Timeouts: si el servidor de correo no responde, el envio falla rapido
# en vez de bloquear la peticion del usuario.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.remitente=${MAIL_USERNAME:noreply@sosclinic.local}
