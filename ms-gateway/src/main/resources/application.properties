server.port=8080
server.address=127.0.0.1
spring.application.name=ms-gateway

app.jwt.secret=${APP_JWT_SECRET}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1

# Ruta explicita hacia ms-seguridad
spring.cloud.gateway.server.webmvc.routes[0].id=ms-seguridad
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://ms-seguridad
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/ms-seguridad/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1

# Ruta hacia ms-pacientes
spring.cloud.gateway.server.webmvc.routes[1].id=ms-pacientes
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://ms-pacientes
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/ms-pacientes/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=StripPrefix=1

