server.port=8088
spring.application.name=ms-ia-agente
spring.web.error.include-message=always

# Credenciales (.env del repo raiz, GROQ_API_KEY, etc.): las carga
# automaticamente EnvEnvironmentPostProcessor al arrancar, sin importar como
# se lance (NetBeans, mvn o levantar-sistema.bat). Las variables reales del
# entorno tienen prioridad sobre el archivo.

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# La clave NUNCA va en el repo: variable de entorno GROQ_API_KEY
groq.api.key=${GROQ_API_KEY:}
groq.modelo=openai/gpt-oss-20b
groq.modelo.respaldo=openai/gpt-oss-120b
agente.razonamiento=low
agente.maxTokensRespuesta=700

# Por donde el agente consulta datos de los otros microservicios
app.gateway.url=${APP_GATEWAY_URL:http://localhost:8080}

groq.voz=whisper-large-v3,whisper-large-v3-turbo
