server.port=8084
server.address=127.0.0.1
spring.application.name=ms-analitica

# Credenciales (.env del repo raiz, MySQL de analitica, etc.): las carga
# automaticamente EnvEnvironmentPostProcessor al arrancar, sin importar como
# se lance (NetBeans, mvn o levantar-sistema.bat). Las variables reales del
# entorno tienen prioridad sobre el archivo.

spring.datasource.url=${ANALITICA_DB_URL:jdbc:mysql://localhost:3306/urgencias_hospital}
spring.datasource.username=${ANALITICA_DB_USERNAME}
spring.datasource.password=${ANALITICA_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.read-only=true
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never

app.jwt.secret=${APP_JWT_SECRET}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
