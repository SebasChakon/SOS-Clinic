services:
  postgres:
    image: postgres:16
    container_name: sos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sosclinic
      POSTGRES_USER: ${DB_USERNAME:-sos_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - sos_pgdata:/var/lib/postgresql/data
      - ./schema-postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql

  pgadmin:
    image: dpage/pgadmin4
    container_name: sos-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@sosclinic.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD es obligatorio}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - postgres

volumes:
  sos_pgdata:
