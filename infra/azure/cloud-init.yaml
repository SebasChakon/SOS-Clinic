#cloud-config
# Preparacion de la VM Ubuntu 24.04 de SOS Clinic.
# cloud-init solo deja el sistema listo (Docker, CLI, systemd, swap, zona
# horaria). El codigo, el .env y las imagenes los sube infra/azure/deploy.ps1.

timezone: America/Bogota
ssh_pwauth: false
disable_root: true

package_update: true
package_upgrade: false
packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - fontconfig
  - fonts-dejavu-core
  - git
  - gnupg
  - jq
  - python3
  - python3-pip
  - tar
  - unzip
  - docker.io
  - docker-compose-v2

write_files:
  - path: /etc/docker/daemon.json
    owner: root:root
    permissions: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "20m",
          "max-file": "3"
        }
      }

  - path: /etc/sysctl.d/99-sos-clinic.conf
    owner: root:root
    permissions: "0644"
    content: |
      vm.swappiness = 10
      vm.overcommit_memory = 1

  - path: /usr/local/bin/sos-acr-login
    owner: root:root
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      if [[ -z "${ACR_NAME:-}" ]]; then
        echo "ACR_NAME no esta definido en /opt/sos-clinic/.env" >&2
        exit 1
      fi

      for intento in 1 2 3 4 5; do
        # La identidad administrada inicia sesion en Azure; despues
        # az acr login reutiliza ese token AAD para Docker.
        if az login --identity --only-show-errors >/dev/null 2>&1 \
           && az acr login --name "$ACR_NAME" --only-show-errors; then
          exit 0
        fi
        echo "ACR login fallo (intento ${intento}/5); reintentando..." >&2
        sleep 10
      done

      echo "No se pudo autenticar contra ACR con la identidad de la VM" >&2
      exit 1

  - path: /etc/systemd/system/sos-clinic.service
    owner: root:root
    permissions: "0644"
    content: |
      [Unit]
      Description=SOS Clinic - stack Docker Compose
      Requires=docker.service
      After=docker.service network-online.target
      Wants=network-online.target
      ConditionPathExists=/opt/sos-clinic/.env
      ConditionPathExists=/opt/sos-clinic/infra/azure/docker-compose.azure.yml

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      WorkingDirectory=/opt/sos-clinic
      EnvironmentFile=/opt/sos-clinic/.env
      ExecStartPre=-/usr/local/bin/sos-acr-login
      ExecStart=/usr/bin/docker compose --env-file /opt/sos-clinic/.env -f /opt/sos-clinic/infra/azure/docker-compose.azure.yml up -d --remove-orphans
      ExecStop=/usr/bin/docker compose --env-file /opt/sos-clinic/.env -f /opt/sos-clinic/infra/azure/docker-compose.azure.yml down
      TimeoutStartSec=900
      TimeoutStopSec=180

      [Install]
      WantedBy=multi-user.target

  - path: /etc/systemd/system/sos-clinic-backup.service
    owner: root:root
    permissions: "0644"
    content: |
      [Unit]
      Description=SOS Clinic - backup de PostgreSQL/MySQL a Blob Storage
      Requires=sos-clinic.service
      After=sos-clinic.service
      ConditionPathExists=/opt/sos-clinic/infra/azure/backup.sh

      [Service]
      Type=oneshot
      EnvironmentFile=/opt/sos-clinic/.env
      ExecStartPre=/usr/bin/az login --identity --allow-no-subscriptions --only-show-errors
      ExecStart=/bin/bash /opt/sos-clinic/infra/azure/backup.sh
      Nice=10
      IOSchedulingClass=idle
      TimeoutStartSec=900

  - path: /etc/systemd/system/sos-clinic-backup.timer
    owner: root:root
    permissions: "0644"
    content: |
      [Unit]
      Description=Backup diario de SOS Clinic (21:30 America/Bogota)

      [Timer]
      OnCalendar=*-*-* 21:30:00
      Persistent=true
      RandomizedDelaySec=10m

      [Install]
      WantedBy=timers.target

runcmd:
  - systemctl daemon-reload
  - systemctl enable --now docker
  - systemctl restart docker
  - usermod -aG docker azureuser
  - timedatectl set-timezone America/Bogota
  - |
    if [ ! -f /swapfile ]; then
      fallocate -l 2G /swapfile
      chmod 600 /swapfile
      mkswap /swapfile
      swapon /swapfile
      grep -q '^/swapfile ' /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab
    fi
  - sysctl --system
  - mkdir -p /opt/sos-clinic /var/backups/sos-clinic
  - chown -R azureuser:azureuser /opt/sos-clinic /var/backups/sos-clinic
  - |
    if ! command -v az >/dev/null 2>&1; then
      curl -fsSL https://aka.ms/InstallAzureCLIDeb -o /tmp/install-az.sh
      bash /tmp/install-az.sh
      rm -f /tmp/install-az.sh
    fi
  - systemctl enable sos-clinic.service
  - systemctl enable --now sos-clinic-backup.timer
  - |
    cat >/etc/motd.tail <<'EOF'

    SOS Clinic - VM de demo
    Stack:      sudo systemctl status sos-clinic
    Logs:       sudo docker compose -f /opt/sos-clinic/infra/azure/docker-compose.azure.yml logs -f
    Backup:     systemctl list-timers sos-clinic-backup.timer
    Apagar:     desde el equipo local: infra/azure/stop.ps1

    EOF

final_message: "SOS Clinic cloud-init termino en $UPTIME segundos."
